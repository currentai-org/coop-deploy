name: Diagnose (read-only)

# READ-ONLY diagnostic. Manually triggered. SSHes to the EC2 host with the same secrets the deploy
# uses, then runs ONLY read commands (docker ps / inspect / logs / exec cat|grep|env). It does NOT run
# up/down/restart/--build and changes NO container or config state. Purpose: locate the retry loop that
# storms Zentropi on the async/inline signal-execution path.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem

      - name: Read-only signal-executor inspection
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP '
            set +e
            echo "=== integrations.config.json ==="
            sudo docker exec cg-server cat /app/integrations.config.json 2>/dev/null | head -80
            echo
            echo "=== relevant runtime env (queue/retry/zentropi) ==="
            sudo docker exec cg-server sh -c "env | grep -iE \"QUEUE|RETRY|ATTEMPT|BACKOFF|CONCURREN|ZENTROPI|SIGNAL\"" 2>/dev/null
            echo
            echo "=== files under /app/services that reference retry/attempts/backoff ==="
            sudo docker exec cg-server sh -c "grep -rlniE \"maxRetries|numRetries|[^a-z]retries|backoff|attempts|retryable|p-retry|requeue\" /app/services /app/utils 2>/dev/null | head -20"
            echo
            echo "=== files that call the zentropi labeler / third-party signals ==="
            sudo docker exec cg-server sh -c "grep -rlnE \"runZentropiLabelerImpl|getZentropiScores|third_party_signals|runLabeler|executeSignal|evaluateSignal\" /app/services 2>/dev/null | head -20"
            echo
            echo "=== makeSignalPermanentError: definition + whether executor checks it ==="
            sudo docker exec cg-server sh -c "grep -rnE \"makeSignalPermanentError|isPermanent|permanentError|shouldRetry|SignalPermanent\" /app/utils /app/services 2>/dev/null | head -30"
          '
