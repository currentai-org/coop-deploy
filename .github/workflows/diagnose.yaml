name: Diagnose (read-only)

# READ-ONLY diagnostic. Manually triggered. SSHes to the EC2 host with the same secrets the deploy
# uses, then runs ONLY read commands (docker ps / inspect / logs, and `docker exec ... cat|grep|sed`
# inside cg-server). It does NOT run `up`/`down`/`restart`/`--build` and changes NO container or config
# state. Purpose: confirm whether the running cg-server actually has the patched zentropiUtils.js (the
# 429/5xx no-retry block) or whether the read-only bind-mount went stale.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem

      - name: Read-only container inspection
        run: |
          PATCH=/app/services/signalsService/signals/third_party_signals/zentropi/zentropiUtils.js
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP "
            set +e
            echo '=== container states ==='
            sudo docker ps --format '{{.Names}}: {{.Status}}'
            echo
            echo '=== HOST patch file: 429 block present? (expect >=1) ==='
            grep -c '429 || response.status >= 500' coop/patches/zentropiUtils.js 2>/dev/null || echo 'host: MISSING/0'
            echo '=== CONTAINER patch file: 429 block present? (expect >=1 if mount fresh) ==='
            sudo docker exec cg-server grep -c '429 || response.status >= 500' $PATCH 2>/dev/null || echo 'container: MISSING/0 or exec failed'
            echo
            echo '=== CONTAINER error-branch (lines 19-45) ==='
            sudo docker exec cg-server sed -n '19,45p' $PATCH 2>/dev/null || echo '(cat failed)'
            echo
            echo '=== cg-server mount source/inode ==='
            sudo docker inspect cg-server --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} (ro={{.RW | not}}){{\"\n\"}}{{end}}' 2>/dev/null
            echo '=== cg-server created / started / restarts ==='
            sudo docker inspect cg-server --format 'Created={{.Created}} StartedAt={{.State.StartedAt}} Restarts={{.RestartCount}} Running={{.State.Running}}' 2>/dev/null
            echo
            echo '=== cg-server recent zentropi/429/error log lines ==='
            sudo docker logs --tail 120 cg-server 2>&1 | grep -iE 'zentropi|429|rate.?limit|retry|error' | tail -25 || echo '(no matching log lines)'
          "
