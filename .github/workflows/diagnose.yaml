name: Diagnose (read-only)

# READ-ONLY probe. Makes ONE bare HTTP request to Zentropi FROM the EC2 host (the same egress IP that
# "test rule" uses) to read the status + rate-limit headers. No auth key, empty body — this cannot label
# or change anything; it only reveals whether the EC2 IP is being 429'd (per-IP throttle) vs 401 (not).
# Changes nothing on the box or in Coop.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem
      - name: Probe Zentropi from the EC2 egress IP
        run: |
          echo "=== EC2 public egress IP ==="
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP "curl -sS -m 10 https://api.ipify.org; echo"
          echo
          echo "=== bare POST to api.zentropi.ai/v1/label FROM the EC2 (no key) — status + rate headers ==="
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP "curl -sS -m 15 -D - -o /dev/null -X POST https://api.zentropi.ai/v1/label -H 'content-type: application/json' -d '{}' 2>&1 | grep -iE 'HTTP/|retry-after|ratelimit|x-rate|cf-ray|429|too many|server:' || echo '(no matching headers)'"
    env: {}
