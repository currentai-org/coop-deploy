name: Diagnose (read-only)

# READ-ONLY. Manual. SSH + docker exec cat|grep only. No up/down/restart/build. Dumps the signal
# executor's retry-budget logic (the storm source) and where the budget value comes from.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem
      - name: Dump signal executor retry-budget logic
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP '
            set +e
            E=/app/services/orgAwareSignalExecutionService/signalExecutionService.js
            echo "############ signalExecutionService.js (lines 1-190) ############"
            sudo docker exec cg-server sed -n "1,190p" $E 2>/dev/null
            echo; echo "############ where does the retry budget / count come from? (grep whole /app) ############"
            sudo docker exec cg-server sh -c "grep -rnE \"retryBudget|retry_budget|maxRetries|numRetries|retries *[:=]|RETRY_|retryCount|budget\" /app/services/orgAwareSignalExecutionService /app/services/signalsService 2>/dev/null | grep -viE \"\.test\.|\.map\" | head -40"
          '
