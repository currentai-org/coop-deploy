name: Diagnose (read-only)

# READ-ONLY. Manual. SSH + docker logs/grep only. No up/down/restart/build. Reads cg-server logs to
# confirm the recent Zentropi error status (429 vs other).

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem
      - name: Read cg-server logs for recent Zentropi status
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP '
            set +e
            echo "=== last 1500 log lines: Zentropi / 429 / rate / label / error matches ==="
            sudo docker logs --tail 1500 cg-server 2>&1 | grep -iE "zentropi|429|rate.?limit|/v1/label|SignalPermanent|Zentropi API error|too many" | tail -40
            echo
            echo "=== count of Zentropi-error lines by status in that window ==="
            sudo docker logs --tail 1500 cg-server 2>&1 | grep -oiE "Zentropi API error: [0-9]{3}[^\"]*" | sort | uniq -c | sort -rn | head
          '
