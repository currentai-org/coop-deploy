name: Diagnose (read-only)

# READ-ONLY diagnostic. Manually triggered. SSHes with the deploy secrets and runs ONLY reads
# (docker exec cat|grep). NO up/down/restart/build; changes nothing. Purpose: dump the retry logic in
# the fetcher/executor that wraps the Zentropi call (the async/inline retry storm source).

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Retrieve Terraform Outputs
        run: |
          cd terraform
          terraform init
          SERVER_IP=$(terraform output -raw instance_public_ip)
          echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"
          terraform output -raw private_key > ../private_key.pem
          chmod 600 ../private_key.pem
      - name: Dump fetcher + executor retry logic
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$SERVER_IP '
            set +e
            F=/app/services/signalsService/helpers/makeCachedFetchers.js
            E=/app/services/orgAwareSignalExecutionService/signalExecutionService.js
            Z=/app/services/signalsService/signals/third_party_signals/zentropi/ZentropiLabelerSignal.js
            echo "############ makeCachedFetchers.js (FULL) ############"
            sudo docker exec cg-server cat $F 2>/dev/null
            echo; echo "############ signalExecutionService.js: retry/permanent lines + context ############"
            sudo docker exec cg-server grep -nE "retry|retries|attempt|backoff|Permanent|shouldRetry|catch|while|for \(|maxRetries|429|5[0-9][0-9]" $E 2>/dev/null | head -60
            echo; echo "############ ZentropiLabelerSignal.js: how it builds/calls the fetcher ############"
            sudo docker exec cg-server grep -nE "fetch|CachedFetcher|makeCached|getZentropiScores|retry|timeout" $Z 2>/dev/null | head -40
          '
